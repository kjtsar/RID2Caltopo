def androidCmakeVersion = "3.22.1"

def androidSdkDir = {
    def localPropertiesFile = rootProject.file("local.properties")
    if (localPropertiesFile.exists()) {
        def localProperties = new Properties()
        localPropertiesFile.withInputStream { localProperties.load(it) }
        def localSdkDir = localProperties.getProperty("sdk.dir")
        if (localSdkDir != null && !localSdkDir.trim().isEmpty()) {
            return file(localSdkDir)
        }
    }

    def envSdkDir = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
    return envSdkDir != null && !envSdkDir.trim().isEmpty() ? file(envSdkDir) : null
}

def cmakeExecutable = {
    def sdkDir = androidSdkDir()
    if (sdkDir != null) {
        def executableName = System.getProperty("os.name").toLowerCase(Locale.US).contains("windows") ? "cmake.exe" : "cmake"
        def sdkCmake = new File(sdkDir, "cmake/${androidCmakeVersion}/bin/${executableName}")
        if (sdkCmake.exists()) {
            return sdkCmake.absolutePath
        }
    }
    return "cmake"
}

def pathWithHostToolDirs = {
    def existingPath = System.getenv("PATH") ?: ""
    def pathEntries = []
    ["/opt/homebrew/bin", "/usr/local/bin"].each { candidate ->
        if (file(candidate).isDirectory()) {
            pathEntries.add(candidate)
        }
    }
    if (!existingPath.trim().isEmpty()) {
        pathEntries.addAll(existingPath.split(java.util.regex.Pattern.quote(File.pathSeparator)))
    }
    return pathEntries.findAll { it != null && !it.trim().isEmpty() }.unique().join(File.pathSeparator)
}

def protobufProtocConfiguration = configurations.create("protobufProtocExecutable") {
    visible = false
    transitive = false
    canBeConsumed = false
    canBeResolved = true
}
def protobufProtocClassifier = {
    def osName = System.getProperty("os.name").toLowerCase(Locale.US)
    def osClassifier
    if (osName.contains("mac") || osName.contains("darwin")) {
        osClassifier = "osx"
    } else if (osName.contains("windows")) {
        osClassifier = "windows"
    } else if (osName.contains("linux")) {
        osClassifier = "linux"
    } else {
        throw new GradleException("Unsupported host OS for protoc: ${System.getProperty("os.name")}")
    }

    def archName = System.getProperty("os.arch").toLowerCase(Locale.US)
    def archClassifier
    if (archName in ["aarch64", "arm64"]) {
        archClassifier = "aarch_64"
    } else if (archName in ["x86_64", "amd64"]) {
        archClassifier = "x86_64"
    } else if (archName in ["x86", "i386", "i686"]) {
        archClassifier = "x86_32"
    } else {
        throw new GradleException("Unsupported host architecture for protoc: ${System.getProperty("os.arch")}")
    }

    return "${osClassifier}-${archClassifier}"
}()
dependencies.add(protobufProtocConfiguration.name, "com.google.protobuf:protoc:3.25.3:${protobufProtocClassifier}@exe")

def appConfigProtoSourceDir = file("src/main/proto")
def appConfigProtoSources = fileTree(appConfigProtoSourceDir) {
    include "**/*.proto"
}
def generateAppConfigProto = tasks.register("generateAppConfigProto") {
    inputs.files(appConfigProtoSources)
    outputs.dir(generatedAppConfigProtoDir)

    doLast {
        def protoFiles = appConfigProtoSources.files.sort { it.absolutePath }
        if (protoFiles.isEmpty()) {
            throw new GradleException("No proto files found in ${appConfigProtoSourceDir}")
        }

        def outputDir = generatedAppConfigProtoDir.get().asFile
        delete(outputDir)
        outputDir.mkdirs()

        def protocExecutable = protobufProtocConfiguration.singleFile
        if (!protocExecutable.canExecute()) {
            protocExecutable.setExecutable(true)
        }

        runProcess(projectDir, [
                protocExecutable.absolutePath,
                "-I",
                appConfigProtoSourceDir.absolutePath,
                "--java_out=lite:${outputDir.absolutePath}"
        ] + protoFiles.collect { it.absolutePath })
    }
}

tasks.register("generateDebugProto") {
    dependsOn(generateAppConfigProto)
}

tasks.register("generateReleaseProto") {
    dependsOn(generateAppConfigProto)
}

