tasks.register("trackerCoordinationTests") {
    group = "verification"
    description = "Runs r2c-tracker coordination and local instance smoke tests when the sibling tracker repo is present."
    doLast {
        def trackerDirPath = System.getenv("R2C_TRACKER_DIR") ?: "${rootDir}/../r2c-tracker"
        def trackerDir = file(trackerDirPath)
        if (!trackerDir.exists()) {
            logger.lifecycle("Skipping trackerCoordinationTests: ${trackerDir} not found")
            return
        }
        def releaseCheck = new File(trackerDir, "release_check.sh")
        if (releaseCheck.exists() && releaseCheck.canExecute()) {
            runProcess(trackerDir, ["./release_check.sh"])
            return
        }
        logger.lifecycle("trackerCoordinationTests: ${releaseCheck} not executable; falling back to Python unit tests only")
        runProcess(trackerDir, ["python3", "-m", "unittest", "discover", "-s", "tests", "-p", "test_*.py"])
    }
}
