# Minimal Apple bring-up configuration for controller RTMP ingest and local RTSP.
logLevel: info
logDestinations: [stdout]
logStructured: no

api: false
metrics: yes
metricsAddress: 127.0.0.1:9998
pprof: false

readTimeout: 90s
writeTimeout: 90s

rtmp: yes
rtmpAddress: :1935
rtsp: yes
rtspAddress: :8554
hls: yes
hlsAddress: :8888
hlsAlwaysRemux: no
hlsVariant: fmp4
hlsSegmentCount: 7
hlsSegmentDuration: 1s
webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ['http://127.0.0.1', 'http://localhost']
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcIPsFromInterfaces: yes
webrtcAdditionalHosts: []
webrtcICEServers2:
  - url: stun:stun.cloudflare.com:3478
srt: no

pathDefaults:
  source: publisher
  overridePublisher: yes
  publisherInactivityCloseAfter: 30s

paths:
  all_others:
    source: publisher
    overridePublisher: yes
    publisherCloseAfter: 20s
    publisherInactivityCloseAfter: 30s
    rtmpPublishVideoOnly: true
