tasks.register("verifyReleaseWebRtcPackaging") {
    group = "verification"
    description = "Fails when R8 removes WebRTC's name-resolved JNI runtime classes."
    dependsOn("minifyReleaseWithR8")
    doLast {
        def mappingDir = layout.buildDirectory.dir("outputs/mapping/release").get().asFile
        def seedsFile = new File(mappingDir, "seeds.txt")
        def usageFile = new File(mappingDir, "usage.txt")
        if (!seedsFile.isFile() || !usageFile.isFile()) {
            throw new GradleException("Missing release R8 seeds/usage output in ${mappingDir}")
        }

        def seeds = seedsFile.readLines()
        def removed = usageFile.readLines() as Set
        def requiredClasses = [
                "org.jni_zero.JniInit",
                "org.jni_zero.JniUtil",
                "org.webrtc.PeerConnectionFactory",
                "org.webrtc.PeerConnection",
                "org.webrtc.DataChannel",
        ]
        requiredClasses.each { className ->
            def retained = seeds.any { line ->
                line == className || line.startsWith("${className}:")
            }
            if (!retained || removed.contains(className)) {
                throw new GradleException(
                        "Release R8 removed required WebRTC runtime class ${className}"
                )
            }
        }
    }
}

