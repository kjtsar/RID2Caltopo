def generatedReleaseNotesAssetsDir = layout.buildDirectory.dir("generated/release-notes/assets")
def generateReleaseNotes = tasks.register("generateReleaseNotes") {
    def outputFile = generatedReleaseNotesAssetsDir.map { it.file("release_notes.txt") }
    outputs.file(outputFile)

    doLast {
        def releaseNotesFile = outputFile.get().asFile
        releaseNotesFile.parentFile.mkdirs()

        def stdout = new ByteArrayOutputStream()
        def stderr = new ByteArrayOutputStream()
        def result = exec {
            commandLine "git", "log", "-10", "--pretty=format:%h%x09%ad%x09%B%x1E", "--date=format:%Y-%m-%d %H:%M:%S %z"
            standardOutput = stdout
            errorOutput = stderr
            ignoreExitValue = true
        }

        def notes = result.exitValue == 0 ? stdout.toString("UTF-8").trim() : ""
        if (notes.isEmpty()) {
            notes = "Release notes unavailable for this build."
        }
        releaseNotesFile.text = notes + System.lineSeparator()
    }
}

