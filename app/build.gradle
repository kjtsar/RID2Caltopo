def canonicalReleaseNotesFile = rootProject.file("release-notes/${appVersionName}/whats_new.txt")
def runProcess = { File workingDirectory, List command, Map environmentOverrides = [:], boolean ignoreExitValue = false ->
    def stdout = new ByteArrayOutputStream()
    def stderr = new ByteArrayOutputStream()
    def processBuilder = new ProcessBuilder(command.collect { it.toString() })
            .directory(workingDirectory)
    processBuilder.environment().putAll(environmentOverrides.collectEntries { key, value ->
        [(key.toString()): value.toString()]
    })

    def process = processBuilder.start()
    def stdoutThread = Thread.start { stdout << process.inputStream }
    def stderrThread = Thread.start { stderr << process.errorStream }
    def exitValue = process.waitFor()
    stdoutThread.join()
    stderrThread.join()

    if (!ignoreExitValue && exitValue != 0) {
        throw new GradleException("Command failed with exit code ${exitValue}: ${command.join(' ')}\n${stderr.toString('UTF-8')}")
    }

    return [
            exitValue: exitValue,
            stdout   : stdout.toString("UTF-8"),
            stderr   : stderr.toString("UTF-8")
    ]
}

def generateReleaseNotes = tasks.register("generateReleaseNotes") {
    def outputFile = generatedReleaseNotesAssetsDir.map { it.file("release_notes.txt") }
    inputs.file(canonicalReleaseNotesFile)
    outputs.file(outputFile)

    doLast {
        def releaseNotesFile = outputFile.get().asFile
        releaseNotesFile.parentFile.mkdirs()

        if (!canonicalReleaseNotesFile.isFile() || canonicalReleaseNotesFile.length() == 0) {
            throw new GradleException("Missing canonical release notes for ${appVersionName}: ${canonicalReleaseNotesFile}")
        }
        def notes = canonicalReleaseNotesFile.getText("UTF-8")
        ["Latest changes:", "Platform-specific changes:", "Known platform differences:"].each { heading ->
            if (!notes.readLines().contains(heading)) {
                throw new GradleException("Canonical release notes are missing '${heading}': ${canonicalReleaseNotesFile}")
            }
        }
        releaseNotesFile.bytes = canonicalReleaseNotesFile.bytes
    }
}

