tasks.register("jacocoTestReport", JacocoReport) {
    dependsOn("testDebugUnitTest")

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }

    def fileFilter = [
            '**/R.class',
            '**/R$*.class',
            '**/BuildConfig.*',
            '**/Manifest*.*',
            '**/*Test*.*',
            '**/*\$Companion*.*',
            '**/*\$Lambda$*.*',
            '**/*\$inlined$*.*',
            '**/*_Factory*.*',
            '**/*_MembersInjector*.*'
    ]

    def javaClasses = files(
            fileTree(
                    dir: "$buildDir/intermediates/javac/debug/classes",
                    excludes: fileFilter
            ),
            fileTree(
                    dir: "$buildDir/intermediates/javac/debug/compileDebugJavaWithJavac/classes",
                    excludes: fileFilter
            )
    )
    def kotlinClasses = fileTree(
            dir: "$buildDir/tmp/kotlin-classes/debug",
            excludes: fileFilter
    )
    classDirectories.setFrom(files(javaClasses, kotlinClasses))
    sourceDirectories.setFrom(files("src/main/java"))
    executionData.setFrom(fileTree(
            dir: buildDir,
            includes: [
                    "jacoco/testDebugUnitTest.exec",
                    "outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec"
            ]
    ))
}

tasks.register("releaseVerification") {
    group = "verification"
    description = "Runs all verification required before producing release artifacts."
    // connectedDebugAndroidTest requires a reachable adb device/emulator. Keep it
    // out of the default release gate until device-level tests are intentional.
    dependsOn("testDebugUnitTest", "trackerCoordinationTests")
    // dependsOn("connectedDebugAndroidTest")
}

tasks.register("uploadReleaseCrashlyticsArtifacts") {
    group = "publishing"
    description = "Uploads release R8 mappings and native symbols to Crashlytics."
    dependsOn("uploadCrashlyticsMappingFileRelease", "uploadCrashlyticsSymbolFileRelease")
}

tasks.matching {
    it.name == "assembleRelease" ||
            it.name == "bundleRelease" ||
            it.name.startsWith("publishRelease")
}.configureEach {
    dependsOn("releaseVerification")
    finalizedBy("uploadReleaseCrashlyticsArtifacts")
}

tasks.register("releaseCheck") {
    group = "verification"
    description = "Runs release verification and assembles the release build."
    dependsOn("releaseVerification", "assembleRelease")
}

tasks.register("trackerCoordinationTests") {
    group = "verification"
    description = "Runs r2c-tracker coordination and local instance smoke tests when the sibling tracker repo is present."
    doLast {
        def trackerDirPath = System.getenv("R2C_TRACKER_DIR") ?: "${rootDir}/../r2c-tracker"
        def trackerDir = file(trackerDirPath)
        if (!trackerDir.exists()) {
            logger.lifecycle("Skipping trackerCoordinationTests: ${trackerDir} not found")
            return
        }
        def releaseCheck = new File(trackerDir, "release_check.sh")
        if (releaseCheck.exists() && releaseCheck.canExecute()) {
            exec {
                workingDir trackerDir
                commandLine "./release_check.sh"
            }
            return
        }
        logger.lifecycle("trackerCoordinationTests: ${releaseCheck} not executable; falling back to Python unit tests only")
        exec {
            workingDir trackerDir
            commandLine "python3", "-m", "unittest", "discover", "-s", "tests", "-p", "test_*.py"
        }
    }
}
