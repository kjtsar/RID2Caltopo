// Read the keystore properties
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(keystorePropertiesFile.newReader())
}

android {
    namespace = "org.ncssar.rid2caltopo"
    compileSdk = 36
    def versionMajor = 1
    def versionMinor = 2
    def versionPatch = 4

    signingConfigs {
        register("release") {
            keyAlias = keystoreProperties["keyAlias"] as String
            keyPassword = keystoreProperties["keyPassword"] as String
            storeFile = file(keystoreProperties["storeFile"] as String)
            storePassword = keystoreProperties["storePassword"] as String
        }
    }

    defaultConfig {
        applicationId "org.ncssar.rid2caltopo"
        minSdk = 29
        targetSdk = 36
        versionCode = 58
        def appVersionName = "${versionMajor}.${versionMinor}.${versionPatch}(${versionCode})"
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        manifestPlaceholders = [
                'appAuthRedirectScheme': 'org.ncssar.rid2caltopo'
        ]
        resValue "string", "app_version", "${appVersionName}"

        android.buildFeatures.buildConfig = true
        buildConfigField "String", "BUILD_VERSION", "\"${appVersionName}\""
        def buildTime = new Date()
        buildConfigField "String", "BUILD_TIME", "\"${buildTime.format('ddLLLyyyy:HHmmss')}\""
        buildConfigField "boolean", "ENABLE_FFMPEG_PROBE", "true"
        buildConfigField "boolean", "ENABLE_FFMPEG_RENDER", "true"
        buildConfigField "String", "FFMPEG_RENDER_DESIGNATOR", "\"\""

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
            signingConfig = signingConfigs.getByName("release")
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose = true
//        viewBinding = true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = "..."
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
        jniLibs {
            useLegacyPackaging = false
        }
    }
    sourceSets {
        main {
            assets.srcDirs += ['src/main/assets']
        }
    }
    testOptions {
        unitTests.all {
            jacoco {
                includeNoLocationClasses = true
                excludes = ['jdk.internal.*']
            }
        }
    }
}

