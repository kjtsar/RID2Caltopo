syntax = "proto3";

option java_package = "org.ncssar.rid2caltopo.data";
option java_multiple_files = true;

message AppConfig {
  int32 schema_version = 1;
  bool legacy_import_complete = 2;

  message CaltopoCredentialsConfig {
    string team_id = 1;
    string credential_id = 2;
    string credential_secret = 3;
  }

  enum CaltopoProfileType {
    CALTOPO_PROFILE_TYPE_UNSPECIFIED = 0;
    CALTOPO_PROFILE_TYPE_HOME = 1;
    CALTOPO_PROFILE_TYPE_MUTUAL_AID = 2;
  }

  message CaltopoProfile {
    string profile_id = 1;
    string display_name = 2;
    CaltopoProfileType profile_type = 3;

    string team_id = 4;
    string credential_id = 5;
    string credential_secret = 6;
    string domain_and_port = 7;

    string track_folder = 8;
    string incident = 9;
    string op_period = 10;
    string tracker_api_key = 11;
    string tracker_url_prefix = 12;

    bool auto_connect = 13;
    int64 expires_at_epoch_ms = 14;
    bool quiet_remove_on_expiry = 15;

    string source_label = 16;
    string target_map_id = 17;
    string target_map_title = 18;
    string target_folder_hint = 19;

    int64 imported_at_epoch_ms = 20;
    string import_dedupe_key = 21;
  }

  message MutualAidTemplate {
    string team_id = 1;
    string credential_id = 2;
    string credential_secret = 3;
    string domain_and_port = 4;
    string source_label = 5;
    string target_folder_hint = 6;
  }

  message RidMapping {
    string remote_id = 1;
    string mapped_id = 2;
    string org = 3;
    string model = 4;
    // Legacy releases used owner as the pilot callsign.
    string owner = 5;
    string owner_name = 6;
    string owner_callsign = 7;
  }

  message LoadedConfigFileRecord {
    string dedupe_key = 1;
    string display_text = 2;
    int64 loaded_at_epoch_ms = 3;
  }

  message ArchiveLocation {
    string tree_uri = 1;
    string selection_hint_uri = 2;
    bool requires_regrant = 3;
  }

  message NotamConfig {
    bool enabled = 1;
    int32 radius_nm = 2;
    bool auto_refresh = 3;
    int32 refresh_interval_seconds = 4;
    bool warn_inside_one_nm = 5;
    string api_base_url = 6;
    string token_url = 7;
    string client_id = 8;
    string client_secret = 9;
    string scope = 10;
    int64 last_updated_epoch_ms = 11;
  }

  message FaaRemoteConfig {
    string token = 1;
    string label = 2;
    string payload_enc = 3;
    int64 last_validated_epoch_ms = 4;
    bool stale = 5;
    string last_failure_reason = 6;
  }

  message LandRestrictionConfig {
    bool enabled = 1;
    bool show_on_map = 2;
    bool auto_refresh = 3;
    // Legacy field name retained for wire compatibility. The value is now
    // operator-facing statute miles and converted internally for agency queries.
    int32 radius_nm = 4;
    int64 last_updated_epoch_ms = 5;
  }

  int64 min_distance_feet = 20;
  int64 new_track_delay_seconds = 21;
  int64 max_idle_time_minutes = 22;
  int64 max_flatline_tone_duration_seconds = 25;
  int32 debug_level = 23;
  bool go_live_flag = 24;

  string coordinate_display_format = 30;
  bool capture_video_streams = 31;
  bool use_peers = 32;
  bool predictive_head_enabled = 33;
  int64 proximity_alert_spacing_feet = 34;
  bool proximity_alert_spacing_configured = 35;
  int64 bridge_check_distance_feet = 36;
  int32 alarm_volume_percent = 37;
  bool alarm_volume_configured = 38;
  bool standalone_r2c_coordination_enabled = 39;

  string caltopo_track_folder = 40;
  string caltopo_domain_and_port = 41;
  CaltopoCredentialsConfig caltopo_credentials = 42;

  string incident = 50;
  string op_period = 51;
  string tracker_api_key = 52;
  string tracker_url_prefix = 53;
  string tracker_faa_proxy_url = 54;
  string tracker_enrollment_url = 55;

  ArchiveLocation archive_location = 60;
  NotamConfig notam = 61;
  FaaRemoteConfig faa_remote_config = 62;
  LandRestrictionConfig land_restrictions = 63;

  repeated RidMapping rid_mappings = 70;
  repeated LoadedConfigFileRecord loaded_config_files = 80;
  MutualAidTemplate mutual_aid_template = 81;
  repeated CaltopoProfile caltopo_profiles = 90;
  string active_caltopo_profile_id = 91;
  // unknown, independent, or tracker. Unknown is conservative for legacy data.
  string caltopo_credential_origin = 92;
}
